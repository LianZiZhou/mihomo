# 合并到现有 Mihomo 配置；入站、代理和规则沿用你的部署。
# 要求 MosDNS 已加载 domain_mapping 插件，且 tag 为 domain_index。
# MosDNS API 仅监听可信本机地址，例如 127.0.0.1:9091。
# 在 MosDNS domain_mapping.args 设置 size: 262144 和
# retention: {mode: lru, ttl_multiplier: 10, min_window: 300, max_window: 86400}
# 可保留客户端超 TTL 使用的域名证据；这些参数由 MosDNS 配置，不放在本段中。
domain-mapping:
  enable: true
  # 所有 provider 共享的查询预算，单位毫秒；省略或 0 时为 50。
  timeout: 50
  # 每个 provider 的 HTTP 连接上限，包含拨号、活动和空闲连接。
  max-connections: 16
  # 当前运行时未完成的查询上限；等待连接和超时后仍在退出的工作也计数。
  max-inflight: 128
  providers:
    - name: mosdns
      type: mosdns-http-v1
      endpoint: http://127.0.0.1:9091/plugins/domain_index/v1/lookup

# domain-mapping 独立于 dns.enable 与 sniffer.enable。
# 使用 MosDNS 解析时可保持 Mihomo dns.enable: false。
# 开启已有 sniffer 可作为外部映射未命中、超时或异常时的回退。
# 域名规则正常使用 DOMAIN / DOMAIN-SUFFIX / RULE-SET；无需改写拨号目标。
